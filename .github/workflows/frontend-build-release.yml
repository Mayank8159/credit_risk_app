name: Frontend Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "app-v*"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-release.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version for manual release (example: 1.2.0)"
        required: false
        type: string
      create_release:
        description: "Create GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  preflight-release-secrets:
    name: Preflight Release Secrets
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/app-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
      - name: Validate EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Add it in repository settings: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        run: npx expo export --platform web --output-dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-dist
          path: frontend/dist

  build-android-eas:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: preflight-release-secrets
    if: startsWith(github.ref, 'refs/tags/app-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS CLI
        working-directory: frontend
        run: |
          which eas
          eas --version

      - name: Build Android APK
        working-directory: frontend
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-android-apk.json
          APK_URL=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('eas-android-apk.json','utf8'));const item=Array.isArray(d)?d[0]:d;process.stdout.write(item?.artifacts?.buildUrl || '');")
          if [ -z "$APK_URL" ]; then
            echo "Could not find APK artifact URL from EAS output"
            exit 1
          fi
          curl -L "$APK_URL" -o credit-risk-android.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-eas-builds
          path: frontend/credit-risk-android.apk

  release-frontend:
    name: Release Frontend
    runs-on: ubuntu-latest
    needs:
      - preflight-release-secrets
      - build-frontend
      - build-android-eas
    if: startsWith(github.ref, 'refs/tags/app-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web-dist
          path: frontend/dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-eas-builds
          path: android

      - name: Prepare release variables
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            echo "tag=app-v${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=app-vmanual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive artifact
        run: |
          cd frontend
          zip -r frontend-web-dist.zip dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            frontend/frontend-web-dist.zip
            android/credit-risk-android.apk
