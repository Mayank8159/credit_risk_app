name: EAS Android APK Build and Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version for manual release (example: 1.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: frontend
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-android-apk.json
          APK_URL=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('eas-android-apk.json','utf8'));const item=Array.isArray(d)?d[0]:d;process.stdout.write(item?.artifacts?.buildUrl || '');")
          if [ -z "$APK_URL" ]; then
            echo "Could not find APK artifact URL from EAS output"
            exit 1
          fi
          curl -L "$APK_URL" -o credit-risk-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/credit-risk-android.apk

      - name: Prepare release tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            echo "tag=app-v${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=app-vmanual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: frontend/credit-risk-android.apk
