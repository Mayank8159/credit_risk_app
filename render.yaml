services:
  - type: web
    name: credit-risk-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_AUTOLOAD
        value: "true"
      - key: MODEL_PATH
        value: models/credit_risk_model.joblib
      - key: DATASET_PATH
        value: datasets/credit_risk_dataset.csv
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: ENABLE_KEEP_WARM_TIMER
        value: "false"
      - key: KEEP_WARM_INTERVAL_SECONDS
        value: "50"
      - key: KEEP_WARM_URL
        value: https://prism-credit-backend-new.onrender.com/health

  - type: cron
    name: credit-risk-api-keep-warm
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python scripts/keep_warm.py
    schedule: "*/10 * * * *"
    envVars:
      - key: KEEP_WARM_URL
        value: https://prism-credit-backend-new.onrender.com/health
      - key: KEEP_WARM_TIMEOUT_SECONDS
        value: "10"
