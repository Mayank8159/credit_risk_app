services:
  - type: web
    name: credit-risk-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_AUTOLOAD
        value: "true"
      - key: MODEL_PATH
        value: models/credit_risk_model.joblib
      - key: DATASET_PATH
        value: datasets/credit_risk_dataset.csv
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: ENABLE_KEEP_WARM_TIMER
        value: "true"
      - key: KEEP_WARM_INTERVAL_SECONDS
        value: "50"
      - key: KEEP_WARM_URL
        value: https://prism-credit-backend-new.onrender.com/health

  - type: cron
    name: credit-risk-keepalive
    runtime: python
    schedule: "*/1 * * * *"
    buildCommand: pip install requests
    envVars:
      - key: KEEP_WARM_URL
        value: https://prism-credit-backend-new.onrender.com/health
