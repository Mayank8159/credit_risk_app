services:
  - type: web
    name: credit-risk-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.asgi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: APP_ENV
        value: production
      - key: MODEL_AUTOLOAD
        value: "true"
      - key: MODEL_PATH
        value: backend/models/credit_risk_model.joblib
      - key: DATASET_PATH
        value: backend/datasets/credit_risk_dataset.csv
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: ENABLE_KEEP_WARM_TIMER
        value: "true"
      - key: KEEP_WARM_INTERVAL_SECONDS
        value: "50"
      - key: KEEP_WARM_URL
        value: https://credit-risk-api.onrender.com/health

  - type: cron
    name: credit-risk-keepalive
    runtime: python
    schedule: "*/1 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import os,requests; requests.get(os.getenv('KEEP_WARM_URL','https://credit-risk-api.onrender.com/health'), timeout=20)"
    envVars:
      - key: KEEP_WARM_URL
        value: https://credit-risk-api.onrender.com/health
